<!DOCTYPE html>
<html>

<head>
    <!--Import Google Icon Font-->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!-- Compiled and minified CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">

    <!--Let browser know website is optimized for mobile-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Focus Best Photography Website</title>
</head>

<body>
    <h1 class="center-align"><a href="/">Focus Best Photography Website</a></h1>

    <div class="row">
        <div class="col s3"></div>
        <div class="col s6">
            <h3>Login</h3><br>
            {% include 'includes/_messages.html' %}
            <form method="POST">
                {% csrf_token %}

                <div class="input-field">
                    <input type="email" id="email" name="email" placeholder="name@example.com">
                    <label for="email">Email address</label>
                </div>

                <div class="input-field">
                    <input type="password" id="password" name="password" placeholder="password">
                    <label for="password">Password</label>
                </div>

                <div class="row">
                    <div class="col s12">
                        <button type="submit" class="waves-effect waves-light btn black">Login</button>
                    </div>
                </div>
            </form>

            <p>Don't have an account?
                <a href="{% url 'register-customer' %}">Register as Customer</a>
                &nbsp;|&nbsp;
                <a href="{% url 'register-photographer' %}">Register as Photographer</a>
            </p>
        </div>
        <div class="col s3"></div>
    </div>

    <!-- Compiled and minified JavaScript -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
</body>

</html>
